[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ft_package"
version = "0.0.1"
description = "A sample test package for piscine python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bsuger", email = "bsuger@student.42.fr" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/BenjaminSuger/Python-Diverse"

[tool.setuptools.packages.find]
where = ["src"]

